    value: "AIzaSyDsJdY0UiNIgJ-N-kjfmtsj7Pqt-igPPuA"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "propflow-crm-estate-2026.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "propflow-crm-estate-2026"
