# Firebase App Hosting Configuration for PropFlow CRM (Next.js App Router)
# Reference: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
